<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Motion Visual 3G</title>

    <meta name="viewport" 
          content="width=device-width, user-scalable=no, 
          initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

 
    <meta http-equiv="Content-Security-Policy" 
          content="
            default-src 'self' data: gap: https://ssl.gstatic.com;
            connect-src http://PI_HOST:5000;
            style-src 'self' 'unsafe-inline';
            script-src 'self' 'unsafe-inline' 'unsafe-eval';">

    <link rel="stylesheet" type="text/css" href="css/index.css" />
</head>

<body>
    <h1>MotionVisual 3G</h1>
    <button id="startButtonId">Start</button>
    <button id="stopButtonId">Stop</button>

    <canvas id="xCanvasId" width="280" height="100"></canvas>
    <h2 id="xLabelId">X:</h2>

    <canvas id="yCanvasId" width="280" height="100"></canvas>
    <h2 id="yLabelId">Y:</h2>

    <canvas id="zCanvasId" width="280" height="100"></canvas>
    <h2 id="zLabelId">Z:</h2>

    <h2 id="tLabelId">Time:</h2>
    <h4>x, y and z are in m/s²</h4>
    <h4>t is in milliseconds since start</h4>

    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="js/index.js"></script>
    <script type="text/javascript" src="js/smoothie.js"></script>
</body>
</html>
